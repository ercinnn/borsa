name: GitHub Pages'e dağıt

on:
  push:
    branches: [main]
    paths:
      - "borsa_takip/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: pub get
        working-directory: borsa_takip
        run: flutter pub get

      - name: build web
        working-directory: borsa_takip
        # API_BASE_URL: repo Settings > Secrets and variables > Actions > Variables
        # altında, barındırılan proxy_server'ın genel URL'si olarak tanımlanmalı.
        run: |
          flutter build web --release \
            --base-href /${{ github.event.repository.name }}/ \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: borsa_takip/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
